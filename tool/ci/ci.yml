name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync assets from spec
        run: |
          mkdir -p assets/ai/schemas assets/ai/prompts test/fixtures/ai
          cp spec/ai/schemas/*.json assets/ai/schemas/
          cp spec/ai/prompts/*.md assets/ai/prompts/
          cp spec/ai/safety_minimums.json assets/ai/
          cp spec/fixtures/ai/* test/fixtures/ai/
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
